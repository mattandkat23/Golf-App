name: Update database

# Applies supabase/migrations to the Supabase project and pushes the sign-in settings in supabase/auth-config.json.
# Needs repo secrets SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD.
on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/supabase.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase
  cancel-in-progress: false

env:
  PROJECT_REF: jcqvzumkfmbksduzdrbx

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        run: |
          missing=""
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -n "$SUPABASE_DB_PASSWORD" ] || missing="$missing SUPABASE_DB_PASSWORD"
          if [ -n "$missing" ]; then echo "::error::Missing repo secrets:$missing"; exit 1; fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Apply migrations
        run: |
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --password "$SUPABASE_DB_PASSWORD"
      - name: Sign-in settings
        run: |
          code=$(curl -sS -X PATCH "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            --data @supabase/auth-config.json -o response.json -w "%{http_code}")
          echo "auth config: HTTP $code"
          if [ "$code" -ge 300 ]; then cat response.json; echo; exit 1; fi
