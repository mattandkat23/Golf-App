name: Test sign-in and sync

# Builds the app and runs scripts/e2e-account.mjs against the real Supabase project with a throwaway user.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: npm run build
      - name: Run
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          npx vite preview --port 4173 &
          for i in $(seq 30); do curl -sf http://localhost:4173/ >/dev/null && break; sleep 1; done
          node scripts/e2e-account.mjs
